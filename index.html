<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Get in touch with Alex Williams.">
  <meta name="theme-color" content="#182026">
  <title>Alex Williams — Get in touch</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; background: #182026; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(2rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-image: linear-gradient(rgba(15, 22, 28, .56), rgba(15, 22, 28, .64)), url("Background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    main {
      width: 100%;
      max-width: 44rem;
      text-align: center;
      padding-block: 2rem;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 1.5rem + 4vw, 4.75rem);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -.035em;
      text-wrap: balance;
      overflow-wrap: break-word;
    }
    p {
      margin: 1.25rem 0 2.25rem;
      font-size: 1.125rem;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: .035em;
    }
    .email {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3.25rem;
      max-width: 100%;
      padding: .875rem 2rem;
      border: 1px solid #f6f3ed;
      border-radius: .25rem;
      background: #f6f3ed;
      color: #182026;
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.5;
      text-decoration: none;
      transition: background-color .15s ease, border-color .15s ease;
    }
    .email:hover { background: #fff; border-color: #fff; }
    .email:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }
    @media (max-width: 40rem) {
      body { background-position: 38% center; }
      p { margin-top: 1rem; margin-bottom: 2rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .email { transition: none; }
    }
    @media (forced-colors: active) {
      .email { border: 1px solid ButtonText; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="name">
    <h1 id="name">Alex Williams</h1>
    <p>Get in touch</p>
    <a class="email" href="mailto:contact@alexmwilliams.com">Email me</a>
  </main>
</body>
</html>
